name: Zgłoszenie błędu
description: Zgłoś problem z działaniem Remote Managera.
title: "[Błąd] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Dziękuję za zgłoszenie. Nie publikuj kluczy połączeń ani innych poufnych danych.
  - type: input
    id: addon-version
    attributes:
      label: Wersja Remote Managera
      placeholder: np. 1.45
    validations:
      required: true
  - type: input
    id: nvda-version
    attributes:
      label: Wersja NVDA
      placeholder: np. 2026.3.1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Opis problemu
      description: Napisz, co się stało i czego oczekiwałeś.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Kroki prowadzące do problemu
      placeholder: |
        1. Otworzyłem...
        2. Wybrałem...
        3. Pojawiło się...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Fragment logu NVDA
      description: Usuń klucze, prywatne hosty i inne dane wrażliwe przed wklejeniem.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Kontrola danych
      options:
        - label: Sprawdziłem, że zgłoszenie i log nie zawierają kluczy ani poufnych danych.
          required: true

